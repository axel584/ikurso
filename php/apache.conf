<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # Log d'accès avec les heures de réception et de fin, et la durée de traitement par Apache (en ms) :
    # un écart entre le délai vu dans le navigateur et cette durée vient de la connexion, pas du PHP.
    # %{remote}p (port du client) et %k (rang de la requête sur une connexion keep-alive) disent si
    # la requête a réutilisé une connexion déjà ouverte.
    LogFormat "%h:%{remote}p k=%k %{begin:%d/%b %T}t -> %{end:%T}t %{ms}Tms \"%r\" %>s %O \"%{Referer}i\"" duree
    CustomLog /proc/self/fd/1 duree
</VirtualHost>
